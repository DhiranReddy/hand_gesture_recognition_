<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal — Captions</title>
    <meta name="theme-color" content="#faf6ef" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf6ef;
        --fg: #241e17;
        --dim: #857868;
        --clay: #a4673d;
        --font-scale: 1;
      }
      body[data-theme="dark"] {
        --bg: #14110e;
        --fg: #f5eee4;
        --dim: #a89a88;
        --clay: #d68f5d;
      }
      body[data-theme="contrast"] {
        --bg: #000000;
        --fg: #ffff00;
        --dim: #ffffff;
        --clay: #00ffff;
      }
      body[data-theme="transparent"] {
        --bg: transparent;
        --fg: #ffffff;
        --dim: #cccccc;
        --clay: #ffd166;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(0, 0, 0, 0.6);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 4vh 5vw;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      #caption {
        font-family: "Fraunces", ui-serif, Georgia, serif;
        font-size: calc(clamp(32px, 8.5vw, 88px) * var(--font-scale));
        font-weight: 500;
        font-variation-settings: "opsz" 144;
        line-height: 1.14;
        letter-spacing: -0.026em;
        overflow-wrap: anywhere;
        max-height: 78vh;
        overflow-y: auto;
        scrollbar-width: none;
      }
      #caption::-webkit-scrollbar { display: none; }
      #caption.idle {
        font-family: "Inter", sans-serif;
        font-size: calc(clamp(16px, 2.6vw, 26px) * var(--font-scale));
        font-weight: 400;
        letter-spacing: 0;
        color: var(--dim);
      }
      .live {
        color: var(--clay);
        border-bottom: 3px solid color-mix(in srgb, var(--clay) 40%, transparent);
      }
      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 11px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn {
        padding: 4px 9px;
        font-size: 10.5px;
        font-weight: 600;
        color: inherit;
        background: transparent;
        border: 1px solid color-mix(in srgb, currentColor 24%, transparent);
        border-radius: 6px;
        cursor: pointer;
        opacity: 0.75;
        transition: opacity 0.15s ease, background 0.15s ease;
      }
      .btn:hover {
        opacity: 1;
        background: color-mix(in srgb, currentColor 10%, transparent);
      }
      .dot {
        display: inline-block;
        width: 6px; height: 6px;
        margin-right: 7px;
        border-radius: 50%;
        background: var(--clay);
      }
      @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
  </head>
  <body data-theme="light">
    <p id="caption" class="idle">Waiting for captions…</p>
    <div class="bar">
      <span><span class="dot"></span><span id="state">Connected</span></span>
      <div class="controls">
        <button type="button" class="btn" id="theme-btn" title="Cycle theme (Light, Dark, High Contrast, Transparent)">Theme: Warm</button>
        <button type="button" class="btn" id="smaller-btn" title="Smaller font (-)">A−</button>
        <button type="button" class="btn" id="larger-btn" title="Larger font (+)">A+</button>
        <button type="button" class="btn" id="fullscreen-btn" title="Toggle fullscreen (F)">⛶ Fullscreen</button>
      </div>
    </div>

    <script type="module">
      const caption = document.getElementById("caption");
      const state = document.getElementById("state");
      const themeBtn = document.getElementById("theme-btn");
      const smallerBtn = document.getElementById("smaller-btn");
      const largerBtn = document.getElementById("larger-btn");
      const fullscreenBtn = document.getElementById("fullscreen-btn");

      const THEMES = [
        { id: "light", label: "Theme: Warm" },
        { id: "dark", label: "Theme: Dark" },
        { id: "contrast", label: "Theme: Contrast" },
        { id: "transparent", label: "Theme: Clear" }
      ];
      let currentThemeIdx = 0;
      let currentScale = 1;

      try {
        const savedTheme = localStorage.getItem("signal.presenter.theme");
        if (savedTheme) {
          const idx = THEMES.findIndex(t => t.id === savedTheme);
          if (idx !== -1) currentThemeIdx = idx;
        }
        const savedScale = localStorage.getItem("signal.presenter.scale");
        if (savedScale) currentScale = parseFloat(savedScale) || 1;
      } catch {}

      function applyTheme() {
        const theme = THEMES[currentThemeIdx];
        document.body.dataset.theme = theme.id;
        themeBtn.textContent = theme.label;
        try { localStorage.setItem("signal.presenter.theme", theme.id); } catch {}
      }

      function applyScale() {
        document.documentElement.style.setProperty("--font-scale", String(currentScale));
        try { localStorage.setItem("signal.presenter.scale", String(currentScale)); } catch {}
      }

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      applyTheme();
      applyScale();

      themeBtn.addEventListener("click", () => {
        currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
        applyTheme();
      });

      smallerBtn.addEventListener("click", () => {
        currentScale = Math.max(0.65, currentScale - 0.1);
        applyScale();
      });

      largerBtn.addEventListener("click", () => {
        currentScale = Math.min(1.6, currentScale + 0.1);
        applyScale();
      });

      fullscreenBtn.addEventListener("click", toggleFullscreen);

      document.addEventListener("keydown", (e) => {
        if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        } else if (e.key === "t" || e.key === "T") {
          currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
          applyTheme();
        } else if (e.key === "+" || e.key === "=") {
          currentScale = Math.min(1.6, currentScale + 0.1);
          applyScale();
        } else if (e.key === "-" || e.key === "_") {
          currentScale = Math.max(0.65, currentScale - 0.1);
          applyScale();
        }
      });

      function render({ text = "", live = "" } = {}) {
        caption.replaceChildren();
        const committed = text.trim();
        if (!committed && !live) {
          caption.className = "idle";
          caption.textContent = "Waiting for captions…";
          return;
        }
        caption.className = "";
        if (committed) caption.append(document.createTextNode(committed));
        if (live) {
          if (committed) caption.append(document.createTextNode(" "));
          const span = document.createElement("span");
          span.className = "live";
          span.textContent = live;
          caption.append(span);
        }
        caption.scrollTop = caption.scrollHeight;
      }

      const channel = new BroadcastChannel("signal-captions");
      channel.onmessage = (event) => render(event.data);

      window.addEventListener("beforeunload", () => channel.close());
      setInterval(() => {
        const alive = window.opener && !window.opener.closed;
        state.textContent = alive ? "Connected" : "Disconnected";
      }, 2000);
    </script>
  </body>
</html>
