<!doctype html>
<html lang="en">
  <head>

    <title>Page Not Found — Signal</title>
    <meta name="theme-color" content="#faf6ef" />

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 24px;

      .error-card {
        max-width: 460px;
        padding: 40px 32px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-xl);
        box-shadow: var(--shadow-md);
      }
      .error-card h1 {
        font-family: var(--serif);
        font-size: 36px;
        font-weight: 500;
        margin-bottom: 12px;
      }
      .error-card p {
        color: var(--ink-mid);
        margin-bottom: 24px;
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <span class="brand-mark" style="margin: 0 auto 16px auto;" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
